# Builds StigGpoManager.exe on Windows, runs the unit tests, and on a v* tag attaches the exe,
# its SHA-256 and the sample config to a DRAFT pre-release (publish it by hand after review).
name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a draft pre-release with this tag (e.g. v1.0.0-beta.1). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          if ($tag -and $tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag '$tag' must look like v1.2.3 or v1.2.3-beta.1" }
          $v = if ($tag) { $tag.TrimStart('v') } else { '1.0.0-ci.' + $env:GITHUB_RUN_NUMBER }
          $num = ($v -replace '-.*$','') + '.' + $env:GITHUB_RUN_NUMBER
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          "VERSIONNUM=$num" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Version $v (file version $num)"

      - name: Unit tests
        run: dotnet test tests/StigGpoManager.Tests/StigGpoManager.Tests.csproj -c Release

      - name: Build exe
        run: dotnet build src/App/StigGpoManager.csproj -c Release -p:Version=${{ env.VERSION }} -p:FileVersion=${{ env.VERSIONNUM }}

      - name: Check version stamp
        shell: pwsh
        run: |
          $vi = (Get-Item src/App/bin/Release/net48/StigGpoManager.exe).VersionInfo
          Write-Host "FileVersion $($vi.FileVersion)  ProductVersion $($vi.ProductVersion)"
          if ($vi.ProductVersion -ne $env:VERSION) { throw "ProductVersion $($vi.ProductVersion) is not $env:VERSION" }
          if ($vi.FileVersion -ne $env:VERSIONNUM) { throw "FileVersion $($vi.FileVersion) is not $env:VERSIONNUM" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/App/bin/Release/net48/StigGpoManager.exe, config.sample.json dist/
          $hash = (Get-FileHash dist/StigGpoManager.exe -Algorithm SHA256).Hash
          "$hash  StigGpoManager.exe" | Set-Content dist/StigGpoManager.exe.sha256 -Encoding ASCII
          "SHA256=$hash" | Out-File -Append $env:GITHUB_ENV
          Write-Host "StigGpoManager.exe SHA-256 $hash"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DAppVersionNum=$env:VERSIONNUM" packaging\installer\StigGpoManager.iss
          if ($LASTEXITCODE) { throw "ISCC failed ($LASTEXITCODE)" }
          $setup = Get-ChildItem dist\StigGpoManager-Setup-*.exe | Select-Object -First 1
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          "$h  $($setup.Name)" | Add-Content dist\StigGpoManager.exe.sha256 -Encoding ASCII
          Write-Host "$($setup.Name) SHA-256 $h"

      - name: Installer test (silent install, upgrade, uninstall)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = (Get-ChildItem dist\StigGpoManager-Setup-*.exe | Select-Object -First 1).FullName
          $exe = "$env:ProgramFiles\StigGpoManager\StigGpoManager.exe"
          function Find-Uninstall { Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'STIG GPO Manager' }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=tray' -Wait -PassThru
          if ($p.ExitCode) { throw "install exit $($p.ExitCode)" }
          if (-not (Test-Path $exe)) { throw 'exe not installed' }
          if (-not (Find-Uninstall)) { throw 'not in Programs and Features' }
          if (-not (Test-Path "$env:ProgramData\StigGpoManager")) { throw 'data folder missing' }
          schtasks /Query /TN 'StigGpoManager Tray' | Out-Null; if ($LASTEXITCODE) { throw 'tray task missing' }
          Write-Host "Installed: $((Find-Uninstall).DisplayVersion)"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode) { throw "upgrade (re-run) exit $($p.ExitCode)" }
          $un = (Find-Uninstall).UninstallString.Trim('"')
          $p = Start-Process $un -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep 3
          if (Find-Uninstall) { throw 'still in Programs and Features after uninstall' }
          if (Test-Path $exe) { throw 'exe left behind' }
          schtasks /Query /TN 'StigGpoManager Tray' 2>$null | Out-Null; if (-not $LASTEXITCODE) { throw 'tray task left behind' }
          Write-Host 'Install / upgrade / uninstall OK'
          exit 0

      - name: Smoke test (exe starts, PowerShell host assembly binds)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath dist/StigGpoManager.exe -ArgumentList 'cli', 'sample-config' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "StigGpoManager.exe cli sample-config exited with $($p.ExitCode)" }

      - name: CLI test (no config fails fast; output reaches redirected stdout and WinRM)
        shell: powershell
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path dist\StigGpoManager.exe).Path
          $missing = Join-Path $env:RUNNER_TEMP 'no-such-config.json'
          $v = (& $exe cli version | Out-String).Trim()
          if ($v -ne $env:VERSION) { throw "cli version printed '$v', expected $env:VERSION" }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $out = & $exe cli preflight --config $missing | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1) { throw "cli preflight without a config exited $code, expected 1" }
          if ($out -notmatch 'No config file') { throw 'cli preflight without a config did not say why' }
          if ($sw.Elapsed.TotalSeconds -gt 60) { throw "cli preflight without a config took $([int]$sw.Elapsed.TotalSeconds)s" }
          Write-Host "Local: exit $code in $([int]$sw.Elapsed.TotalSeconds)s"
          try { Enable-PSRemoting -Force -SkipNetworkProfileCheck | Out-Null }
          catch { Write-Warning "WinRM not available on this runner ($($_.Exception.Message)); WinRM case skipped."; exit 0 }
          $job = Invoke-Command -ComputerName localhost -AsJob -ArgumentList $exe, $missing -ScriptBlock {
            param($e, $c)
            $o = & $e cli preflight --config $c | Out-String
            [pscustomobject]@{ Out = $o; Code = $LASTEXITCODE }
          }
          if (-not (Wait-Job $job -Timeout 180)) { Stop-Job $job; throw 'cli preflight over WinRM did not finish within 180 s (hang)' }
          $r = Receive-Job $job -ErrorAction Continue
          if ($job.State -eq 'Failed' -or -not $r) { Write-Warning "WinRM session could not be opened on this runner: $($job.ChildJobs[0].JobStateInfo.Reason)"; exit 0 }
          Write-Host "WinRM output:`n$($r.Out)"
          if ($r.Code -ne 1) { throw "over WinRM: exit $($r.Code), expected 1" }
          if ($r.Out -notmatch 'No config file') { throw 'over WinRM: the message did not reach the remote session' }
          Write-Host 'CLI over WinRM OK'
          exit 0

      - name: Screenshots (demo mode, simulated domain)
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          $out = Join-Path $pwd 'screenshots'
          $p = Start-Process -FilePath dist/StigGpoManager.exe -ArgumentList '/screenshots', "`"$out`"" -Wait -PassThru
          Get-ChildItem $out -ErrorAction SilentlyContinue | Format-Table Name, Length
          if (Test-Path "$out/error.txt") { Get-Content "$out/error.txt" }
          if ($p.ExitCode -ne 0) { throw "Screenshot tour exited with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: StigGpoManager-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: StigGpoManager-*
          merge-multiple: true

      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          {
            echo "Single-file STIG GPO Manager for Windows Server 2025 / Windows 11 (.NET Framework 4.8, in-box)."
            echo
            echo "Install with \`StigGpoManager-Setup-${TAG#v}.exe\` (Programs and Features, Start menu, tray icon), or run the portable \`StigGpoManager.exe\`. See README.md."
            echo
            echo "**SHA-256** (record these for the transfer into the enclave):"
            echo
            echo '```'
            cat dist/StigGpoManager.exe.sha256
            echo '```'
            echo
            echo "Installed builds show the version in the window title and in the exe's Properties > Details (Product version ${TAG#v})."
            echo
            echo "**Pre-release:** not yet validated against a production domain. Test the full quarterly cycle in the lab domain first."
          } > notes.md
          cat notes.md
          # --target creates the tag at the built commit when it does not exist yet (manual run).
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "STIG GPO Manager $TAG" --notes-file notes.md
